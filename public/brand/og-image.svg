<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080D" />
      <stop offset="50%" stop-color="#0B101C" />
      <stop offset="100%" stop-color="#080B14" />
    </linearGradient>
    <radialGradient id="glow-grad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#1E3A8A" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#06080D" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="dcp-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#glow-grad)" />

  <!-- Subtle Blueprint Grid lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.35">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Pill Badge -->
  <g transform="translate(420, 90)">
    <rect width="360" height="34" rx="17" fill="#0F172A" stroke="#2563EB" stroke-width="1" opacity="0.9" />
    <circle cx="20" cy="17" r="4" fill="#3B82F6" />
    <text x="36" y="22" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#60A5FA" letter-spacing="0.16em" font-weight="600">
      ELITE ENGINEERING PARTNER
    </text>
  </g>

  <!-- Centered Logo Emblem -->
  <g transform="translate(480, 140) scale(0.48)">
    <path d="M 140 110 L 260 110 C 275 110, 285 116, 292 125 C 272 138, 255 160, 245 185 L 205 185 L 205 315 L 270 315 C 285 315, 305 305, 320 290 L 320 340 C 300 375, 260 390, 215 390 L 140 390 Z" fill="#F8FAFC" />
    <path d="M 268 128 C 285 128, 305 132, 325 142 C 355 158, 375 188, 375 228 C 375 272, 350 305, 312 320 L 268 320 L 268 425 L 268 360 L 268 320 C 252 305, 238 285, 230 262 C 240 248, 248 232, 252 215 C 255 200, 255 185, 252 170 C 255 155, 260 142, 268 128 Z" fill="url(#dcp-blue)" />
    <g fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="translate(305, 155)">
      <polyline points="14,10 4,20 14,30" />
      <line x1="22" y1="8" x2="16" y2="32" stroke-width="7" />
      <polyline points="24,10 34,20 24,30" />
    </g>
    <circle cx="268" cy="245" r="58" fill="#FFFFFF" />
    <circle cx="268" cy="245" r="58" fill="none" stroke="#0D111A" stroke-width="4" />
    <circle cx="268" cy="245" r="32" fill="#2563EB" />
    <circle cx="262" cy="238" r="8" fill="#93C5FD" opacity="0.6" />
  </g>

  <!-- Wordmark: DevCenterPoint -->
  <text x="600" y="420" text-anchor="middle" font-family="'Archivo', 'Inter', system-ui, sans-serif" font-weight="700" font-size="64" letter-spacing="-0.03em">
    <tspan fill="#3B82F6">Dev</tspan><tspan fill="#FFFFFF">Center</tspan><tspan fill="#3B82F6">Point</tspan>
  </text>

  <!-- Slogan: CODE. BUILD. DEPLOY. SCALE. -->
  <text x="600" y="475" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="20" letter-spacing="0.32em" fill="#94A3B8">
    CODE. BUILD. DEPLOY. SCALE.
  </text>

  <!-- Bottom Details -->
  <line x1="350" y1="530" x2="850" y2="530" stroke="#1E293B" stroke-width="1" />
  <text x="600" y="565" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="16" fill="#64748B">
    High-Performance Architecture &middot; Cloud Engineering &middot; 3D Storytelling
  </text>
</svg>
